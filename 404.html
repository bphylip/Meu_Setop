<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Setop | Página não encontrada</title>

    <meta name="author" content="Brayan Phylip">
    <meta name="description" content="Esta página do MeuSetop não foi encontrada.">
    <meta name="robots" content="noindex, nofollow, noarchive">

    <!-- favicon -->
    <link rel="shortcut icon" href="/src/assets/img/global/sm2.svg" type="image/svg+xml">

    <!-- CSS link -->
    <link rel="preload" href="/src/styles/pages/404/style.css" as="style">
    <link rel="stylesheet" href="/src/styles/pages/404/style.css">

    <!-- Preload image -->
    <link rel="preload" href="/src/assets/img/pages/404/mslogo-glitch.gif" as="image">
    <link rel="preload" href="/src/assets/img/pages/404/noise.webp" as="image">

    <!-- Preload Font -->
    <link rel="preload" href="https://fonts.googleapis.com/css?family=Inconsolata" as="style">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inconsolata">

</head>

<body>
    <div id="screen" class="screen off initial-off"></div>
    <div class="noise"></div>
    <div class="overlay"></div>
    <div class="bglogo"> <img src="/src/assets/img/pages/404/mslogo-glitch.gif" class="logo" alt="logo meusetop"> </div>

    <div class="terminal">
        <h1 class="error glitch-gradient">Error <span class="errorcode">404</span></h1>
        <p class="output">ops! parece que alguém desligou nosso rgb! mas não se preocupe, logo restabeleceremos o brilho
            de sua presença!</p>
        <p class="output">tente <a href="javascript:history.back()">voltar</a> ou <a href="/index.html">siga para a
                pagina inicial</a>.</p>
        <p class="output"><a class="ms" href="/index.html">meusetop</a> agradece!</p>
    </div>

    <script>
        const screen = document.getElementById('screen');
        let isOn = false;

        document.body.classList.add("content-hidden");
        window.addEventListener("load", () => {
            setTimeout(() => {
                screen.classList.remove("initial-off");
                screen.classList.add("on");
                setTimeout(() => { document.body.classList.remove("content-hidden"); screen.classList.add("ready"); isOn = true; }, 400);
            }, 50);
        });

        // Função de desligar a TV com callback 
        function desligarTV(callback) {
            screen.classList.remove("on", "ready", "off");
            void screen.offsetWidth;
            document.body.classList.add("content-hidden");
            screen.classList.add("off");
            setTimeout(() => { if (callback) callback(); }, 400);
        }

        // // Intercepta todos os links da página 
        const links = document.querySelectorAll("a");
        links.forEach(link => {
            link.addEventListener("click", e => {
                e.preventDefault();
                const href = link.getAttribute("href");
                desligarTV(() => {
                    if (href.startsWith("javascript:")) {
                        eval(href.replace("javascript:", ""));
                    }
                    else {
                        window.location.href = href;
                    }
                });
            });
        });

    </script>

</body>

</html>
